version: '3.8'

services:
  db:
    image: mysql:8.0.33
    container_name: muthabara_db
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: kunturtatto
      MYSQL_USER: kuntur_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    container_name: muthabara_app
    ports:
      - "8081:8080"
    environment:
      - DB_URL_KUNTUR=jdbc:mysql://db:3306/kunturtatto?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
      - DB_USER_NAME=kuntur_user
      - DB_PASSWORD=${DB_PASSWORD}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - APP_UPLOAD_DIR=/app/images
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_TOMCAT_REMOTEIP_REMOTE_IP_HEADER=x-forwarded-for
      - SERVER_TOMCAT_REMOTEIP_PROTOCOL_HEADER=x-forwarded-proto
      - SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXY=.*
      - SERVER_FORWARDHEADERS_STRATEGY=native
      - SERVER_USE_FORWARD_HEADERS=true
      - APP_URL=https://muthabara.cloud
      - SERVER_URL=https://muthabara.cloud
    volumes:
      - uploads:/app/images
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  uploads:
  logs: