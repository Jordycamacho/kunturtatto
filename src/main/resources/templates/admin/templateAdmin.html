<head th:fragment="header">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muthabara</title>
    <link rel="icon" th:href="@{/images/Logo_negro.png}" type="image/png">
    <link th:href="@{/estilos/estilos.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
</head>

<nav th:fragment="nav_user" hidden></nav>

<nav th:fragment="nav_admin" class="admin-bar">
    <div class="admin-bar__top">
        <a class="admin-brand" th:href="@{/admin}">Muthabara<small>Panel del estudio</small></a>
        <div class="admin-side">
            <a th:href="@{/Muthabara}" target="_blank" rel="noopener">Ver la web</a>
            <form th:action="@{/Muthabara/logout}" method="post">
                <button type="submit">Salir</button>
            </form>
        </div>
    </div>
    <div class="admin-links">
        <a th:href="@{/admin}">Inicio<small>qué hacer</small></a>
        <a th:href="@{/admin/consultas}">Consultas<small>mensajes de la web</small></a>
        <a th:href="@{/admin/appointments}">Citas<small>la agenda</small></a>
        <a th:href="@{/admin/disenos}">Diseños<small>fotos de la web</small></a>
        <a th:href="@{/admin/categorias}">Categorías<small>grupos</small></a>
        <a th:href="@{/admin/subcategorias}">Subcategorías<small>apartados</small></a>
        <a th:href="@{/admin/usuarios}">Usuarios<small>quién entra</small></a>
    </div>
</nav>

<p th:fragment="hint(text)" class="admin-hint" th:text="${text}"></p>

<div th:fragment="script">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/5971328ca7.js" crossorigin="anonymous"></script>

</div>
