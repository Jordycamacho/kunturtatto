# ====================================
# CONFIGURACIÓN GENERAL
# ====================================
spring.application.name=Muthabara
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
# ====================================
# CONFIGURACIÓN DE BASE DE DATOS
# ====================================
spring.datasource.url=${DB_URL_KUNTUR:jdbc:mysql://localhost:3306/kunturtatto?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER_NAME:root}
spring.datasource.password=${DB_PASSWORD:752957}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================================
# CONFIGURACIÓN JPA/HIBERNATE
# ====================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ====================================
# CONFIGURACIÓN DE EMAIL
# ====================================
email.sender=${EMAIL_USER:kunturtattoo.studio@gmail.com}
email.password=${EMAIL_PASS}

# ====================================
# CONFIGURACIÓN DE ARCHIVOS
# ====================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${APP_UPLOAD_DIR:./images}

# ====================================
# CONFIGURACIÓN DE LOGGING
# ====================================
logging.file.name=${LOGGING_FILE_NAME:logs/muthabara.log}
logging.file.path=${LOGGING_FILE_PATH:./logs}
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.kunturtatto=DEBUG

# ====================================
# CONFIGURACIÓN DE SEGURIDAD
# ====================================
server.error.include-message=always
server.error.include-stacktrace=never

# ====================================
# GOOGLE ANALYTICS
# ====================================
google.analytics.tracking-id=${GOOGLE_ANALYTICS_TRACKING_ID:G-1RQQVKEJ4T}
google.analytics.enabled=${GOOGLE_ANALYTICS_ENABLED:true}
google.analytics.anonymize-ip=true
google.analytics.respect-dnt=true

# ====================================
# CONFIGURACIÓN DE CACHE
# ====================================
spring.cache.type=simple
spring.cache.cache-names=consultations,consultationById,consultationsAll,consultationsUnread,consultationsStats,consultationsRecent





server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxy=.*
server.use-forward-headers=true

# URL base de la aplicación (para links absolutos)
app.url=${APP_URL:https://muthabara.cloud}
server.url=${SERVER_URL:https://muthabara.cloud}

# Configuración de cookies seguras
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict